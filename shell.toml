# Liquid Glass-inspired machine-level shell overrides.
# These values layer over any Omarchy color theme and survive theme switches.

[bar]
background-alpha = 0.66

[controls]
normal-fill-alpha         = 0.07
normal-border-alpha       = 0.30
hover-cursor-fill-alpha   = 0.13
hover-cursor-border-alpha = 0.40
focus-fill-alpha          = 0.14
focus-border-alpha        = 0.45
selected-fill-alpha       = 0.22
pressed-fill-alpha        = 0.28

[popups]
background-alpha = 0.74
border-alpha     = 0.62

[tooltip]
background-alpha = 0.76
border-alpha     = 0.48

[notifications]
background-alpha = 0.74
border-alpha     = 0.62

[launcher]
background-alpha          = 0.72
border-alpha              = 0.58
scrim-alpha               = 0.26
selected-background-alpha = 0.14

[menu]
background-alpha          = 0.72
border-alpha              = 0.58
scrim-alpha               = 0.26
selected-background-alpha = 0.14

[polkit]
background-alpha = 0.78
border-alpha     = 0.66
scrim-alpha      = 0.32

[lock]
background-alpha = 0.62
border-alpha     = 0.65

[font]
base-size = 10
